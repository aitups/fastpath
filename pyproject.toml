[project]
name = "fastpath"
version = "0.1.9"
description = ""
authors = [{name = "esc", email = "edusc.wrk@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.2",
    "llama-index>=0.12.43",
    "langchain>=0.3.26",
    "llama-index-embeddings-openai>=0.3.1",
    "llama-index-embeddings-huggingface>=0.4.0",
    "openai>=1.91.0",
    "requests>=2.32.4",
    "google-generativeai>=0.8.5",
    "influxdb-client>=1.49.0",
    "redis>=6.2.0",
    "couchbase>=4.4.0",
    "llama-index-vector-stores-postgres>=0.4.2",
    "llama-index-vector-stores-chroma>=0.4.2",
    "llama-index-vector-stores-milvus>=0.8.5",
    "llama-index-vector-stores-elasticsearch>=0.4.3",
    "chromadb>=1.0.13",
    "pymilvus>=2.5.11",
    "psycopg2-binary>=2.9.10",
    "langchain-community>=0.3.26",
    "duckduckgo-search>=8.0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "testcontainers>=4.10.0",
    "pytest-docker>=3.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
