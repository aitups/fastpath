[pytest]
pythonpath = src

# Custom markers
markers =
    integration: tests requiring external services (Docker containers, real API keys)

# Warning filters: suppress third-party deprecation warnings that are out of our control
# (Pydantic v2 deprecation from llama-index, and legacy testcontainers wait decorators)
filterwarnings =
    ignore:Support for class-based `config` is deprecated:DeprecationWarning
    ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning
    ignore:The wait_for_logs function with string or callable predicates is deprecated:DeprecationWarning