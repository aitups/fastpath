# --- LLM Provider Configuration ---
# Select the default LLM provider for agents.
# Options: 'openai', 'ollama', 'gemini'
llm_provider: ollama

# --- LLM Specific Settings ---
# Configure the parameters for each LLM provider.
# Only the section for the selected 'llm_provider' will be used.
llm_config:
  openai:
    model: 'gpt-4o'
    api_key: ${OPENAI_API_KEY} # Loaded from environment variables

  ollama:
    model: 'llama3:8b'
    base_url: 'http://localhost:11434'

  gemini:
    model: 'gemini-pro'
    api_key: ${GEMINI_API_KEY} # Loaded from environment variables

# --- Embedding Model Configuration ---
# Select the provider for generating embeddings (for RAG/KnowledgeBase).
# Options: 'huggingface', 'openai'
embedding_provider: huggingface

# --- Embedding Model Specific Settings ---
# Configure the model for the selected 'embedding_provider'.
embedding_model: 'all-MiniLM-L6-v2' # For huggingface
# embedding_model: 'text-embedding-ada-002' # For openai

# --- Knowledge Base and Memory ---
vector_store_path: './fastpath_db'

# --- Memory Provider Configuration ---
memory_provider: in_memory  # Options: in_memory, influxdb, redis, couchbase

memory_config:
  in_memory: {}
  influxdb:
    url: "http://localhost:8086"
    token: "my-token"
    org: "my-org"
    bucket: "fastpath"
  redis:
    host: "localhost"
    port: 6379
    db: 0
  couchbase:
    connection_string: "couchbase://localhost"
    username: "Administrator"
    password: "password"
    bucket: "fastpath"

# --- Vector Store Provider Configuration ---
vector_store_provider: in_memory  # Options: in_memory, chroma, milvus, elasticsearch, pgvector

vector_store_config:
  in_memory: {}
  chroma:
    persist_directory: "./chroma_db"
  milvus:
    host: "localhost"
    port: 19530
    collection_name: "fastpath"
  elasticsearch:
    host: "localhost"
    port: 9200
    index_name: "fastpath"
  pgvector:
    host: "localhost"
    port: 5432
    user: "postgres"
    password: "password"
    database: "fastpath"
    table_name: "vectors" 